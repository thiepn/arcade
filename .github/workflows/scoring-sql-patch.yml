name: Patch scoring SQL syntax
on:
  push:
    branches: [fix/scoring-balance-v2]
    paths: ['.github/workflows/scoring-sql-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run quality:scoring
      - name: Disambiguate CASE expressions and regenerate migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/generate-scoring-migrations.py');s=p.read_text()
          patches={
            "< CASE WHEN sess.game_id='reaction' THEN 750 ELSE 250 END THEN":"< (CASE WHEN sess.game_id='reaction' THEN 750 ELSE 250 END) THEN",
            "p_score>CASE WHEN cfg->>'kind'='finite' THEN 100000 WHEN sess.game_id='airhockey' THEN 1000000 ELSE 1000000000000 END THEN":"p_score>(CASE WHEN cfg->>'kind'='finite' THEN 100000 WHEN sess.game_id='airhockey' THEN 1000000 ELSE 1000000000000 END) THEN",
          }
          for old,new in patches.items():
              assert s.count(old)==1, old
              s=s.replace(old,new)
          s=s.replace('END $fn$;', 'END; $fn$;').replace('END $gate$;', 'END; $gate$;')
          p.write_text(s)
          PY
          python3 scripts/generate-scoring-migrations.py
          git diff --check
      - name: Commit source fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/generate-scoring-migrations.py supabase/migrations/20260909_scoring_v2.sql
          git commit -m 'Fix CASE expression parsing in atomic PostgreSQL score ingestion'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/scoring-balance-v2
