name: Apply deep game polish

on:
  push:
    branches: [feat/deep-game-polish]

permissions:
  contents: read

concurrency:
  group: apply-deep-game-polish
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply reviewed 32-game balance patch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/deep-polish/part0 ]; then
            echo 'Patch already applied.'
            exit 0
          fi
          cat tools/deep-polish/part{0,1,2,3,4} | base64 --decode | gzip --decompress > /tmp/deep-polish.patch
          echo 'fc867c50ec642e0cb4f51f04412949faf729082c8a85b546f819ff2ab1dc8d75  /tmp/deep-polish.patch' | sha256sum --check
          git apply --check /tmp/deep-polish.patch
          git apply /tmp/deep-polish.patch
          git rm tools/deep-polish/part{0,1,2,3,4}
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Deep polish and rebalance all 32 games'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/deep-game-polish
