name: Patch HUD render performance

on:
  push:
    branches: [perf/hud-render-pass]
    paths:
      - scripts/patch-hud-render-performance.py
      - .github/workflows/patch-hud-render-performance.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply render publication patch
        run: python scripts/patch-hud-render-performance.py
      - run: bun install --frozen-lockfile
      - run: bun run quality:hud-render
      - run: bun run quality:games
      - run: bun run quality:frame-rate
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bun run quality:astro
      - run: bun run quality:drift
      - run: bun run quality:slingshot
      - run: bun run quality:tower
      - run: bun run quality:knife
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified performance changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/hooks/useGameLoop.ts src/games scripts/audit-hud-render-performance.ts scripts/audit-release-32.ts package.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Optimize canvas HUD render publication'
          git push origin HEAD:perf/hud-render-pass
