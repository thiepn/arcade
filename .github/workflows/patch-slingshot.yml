name: Patch Orbital Slingshot

on:
  push:
    branches: [fix/slingshot-determinism-resize]
    paths: [.github/workflows/patch-slingshot.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/slingshot-determinism-resize
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify Orbital Slingshot repair
        shell: bash
        run: |
          python scripts/patch-slingshot.py
          rm scripts/patch-slingshot.py
          bun install --frozen-lockfile
          bun run quality:slingshot
          bunx tsc --noEmit
          bun run build
      - name: Commit repaired Orbital Slingshot source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Orbital Slingshot timing resize and pause input'
          git push origin HEAD:fix/slingshot-determinism-resize
