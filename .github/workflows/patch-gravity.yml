name: Patch Gravity

on:
  push:
    branches: [fix/gravity-determinism-resize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Gravity repair'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/gravity-determinism-resize
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify Gravity repair
        shell: bash
        run: |
          python scripts/patch-gravity.py
          bun install --frozen-lockfile
          bun run quality:gravity
          bunx tsc --noEmit
          bun run build
      - name: Commit repaired Gravity source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/GravityGame.tsx src/lib/gravityRuntime.ts scripts/audit-gravity.ts package.json
          git commit -m 'Fix Gravity physics determinism and resize continuity'
          git push origin HEAD:fix/gravity-determinism-resize
