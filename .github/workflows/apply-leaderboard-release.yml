name: Apply Leaderboard Release
on:
  push:
    branches: [release/leaderboard-v3-transfer]
    paths: [.github/workflows/apply-leaderboard-release.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: release/leaderboard-v3-transfer
      - name: Verify and apply exact locally tested files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,shutil
          parts=sorted(pathlib.Path('.leaderboard-transfer').glob('part*'))
          assert len(parts)==6
          packed=base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='a31f93224eac0e44c6aebbea2c6885a417e861d3c2cb75dcfae579296500ed46','Transfer hash mismatch'
          delta=json.loads(lzma.decompress(packed))
          assert len(delta)==44
          manifest={}
          for name,entry in delta.items():
              p=pathlib.Path(name)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              old=p.read_text() if p.exists() else ''
              assert hashlib.sha256(old.encode()).hexdigest()==entry['before'],name+' base mismatch'
              lines=old.splitlines(keepends=True)
              for start,end,text in reversed(entry['edits']): lines[start:end]=[text]
              new=''.join(lines)
              assert hashlib.sha256(new.encode()).hexdigest()==entry['after'],name+' output mismatch'
              p.parent.mkdir(parents=True,exist_ok=True);p.write_text(new)
              manifest[name]=entry['after']
          shutil.rmtree('.leaderboard-transfer')
          pathlib.Path('.github/workflows/apply-leaderboard-release.yml').unlink()
          print(json.dumps(manifest,indent=2))
          PY
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run quality:leaderboard
      - run: bunx tsc --noEmit
      - run: bun run build:pages
      - name: Commit source changes only; workflow changes use the GitHub connector
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD -- .github/workflows
          git add -A
          git commit -m 'Rebuild leaderboard v3: precise AP, immutable runs, reliable uploads and ranked modes'
          git push origin HEAD:release/leaderboard-v3-transfer
