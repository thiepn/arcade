name: Patch Cyber Crosser

on:
  push:
    branches: [fix/cyber-crosser-fairness]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Apply Cyber Crosser fairness and responsive fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/games/RoadCrossGame.tsx')
          s = path.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'missing expected source fragment:\n{old}')
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one source fragment, found {s.count(old)}:\n{old}')
              s = s.replace(old, new, 1)

          replace_once(
              "import { useGameLoop, useSafeTimeout } from '../hooks/useGameLoop';\n",
              "import { useGameLoop, useSafeTimeout } from '../hooks/useGameLoop';\nimport { canAcceptRoadCrossMove, getRoadCrossBoardMetrics } from '../lib/roadCrossSupport';\n",
          )

          replace_once(
              "    if (!state.isAlive || isPausedRef.current) return;\n\n    // Strict 1-block discrete movements\n",
              "    if (!state.isAlive || isPausedRef.current) return;\n    if (!canAcceptRoadCrossMove(state.jumpProgress)) return;\n\n    // Strict 1-block discrete movements\n",
          )

          replace_once(
              "    const targetCol = Math.max(0, Math.min(COLS_COUNT - 1, state.col + dCol));\n    const targetRow = Math.max(0, state.row + dRow);\n\n    if (dRow > 0) state.facing = 'up';\n",
              "    const targetCol = Math.max(0, Math.min(COLS_COUNT - 1, state.col + dCol));\n    const targetRow = Math.max(0, state.row + dRow);\n    if (targetCol === state.col && targetRow === state.row) return;\n\n    if (dRow > 0) state.facing = 'up';\n",
          )

          replace_once(
              "    const boardWidth = COLS_COUNT * TILE_SIZE;\n    const offsetX = (rect.width - boardWidth) / 2;\n    const playerScreenX = offsetX + gameStateRef.current.col * TILE_SIZE + TILE_SIZE / 2;\n",
              "    const tapMetrics = getRoadCrossBoardMetrics(rect.width);\n    const playerScreenX =\n      tapMetrics.offsetX +\n      (gameStateRef.current.col * TILE_SIZE + TILE_SIZE / 2) * tapMetrics.scale;\n",
          )

          replace_once(
              "      const boardWidth = COLS_COUNT * TILE_SIZE;\n      const offsetX = (w - boardWidth) / 2;\n",
              "      const boardWidth = COLS_COUNT * TILE_SIZE;\n      const boardMetrics = getRoadCrossBoardMetrics(w);\n      const boardScale = boardMetrics.scale;\n      const renderOffsetX = boardMetrics.offsetX;\n      // Board drawing below runs in original world coordinates inside a horizontal fit transform.\n      const offsetX = 0;\n",
          )

          replace_once(
              "                x: offsetX + (coin.col + 0.5) * TILE_SIZE,\n",
              "                x: renderOffsetX + (coin.col + 0.5) * TILE_SIZE * boardScale,\n",
          )

          replace_once(
              "      // Draw Lanes\n      for (const lane of state.lanes) {\n",
              "      // Keep the original 9-column world/physics, but fit it horizontally on narrow screens.\n      ctx.save();\n      ctx.translate(renderOffsetX, 0);\n      ctx.scale(boardScale, 1);\n\n      // Draw Lanes\n      for (const lane of state.lanes) {\n",
          )

          replace_once(
              "      // Laser Death Line\n",
              "      ctx.restore();\n\n      // Laser Death Line\n",
          )

          replace_once(
              "className=\"relative w-full h-full min-h-[440px] flex flex-col items-center justify-center bg-[#050508] select-none overflow-hidden touch-none cursor-pointer\"",
              "className=\"relative w-full h-full min-h-0 flex flex-col items-center justify-center bg-[#050508] select-none overflow-hidden touch-none cursor-pointer\"",
          )

          replace_once(
              "<canvas ref={canvasRef} className=\"w-full h-full block\" />",
              "<canvas ref={canvasRef} className=\"w-full h-full min-h-0 block\" />",
          )

          path.write_text(s)
      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-roadcross.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/RoadCrossGame.tsx .github/workflows/patch-roadcross.yml
          git commit -m "Fix Cyber Crosser responsive fairness"
          git push origin HEAD:fix/cyber-crosser-fairness
