name: Patch scoring header label
on:
  push:
    branches: [fix/scoring-balance-v2]
    paths: ['.github/workflows/scoring-header-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Keep AP label compact while preserving full description
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/GameShell.tsx')
          s=p.read_text()
          old='title="Calibrated Arcade Points, scoring v2">ARCADE PTS</span>'
          assert s.count(old)==2
          p.write_text(s.replace(old,'title="Calibrated Arcade Points, scoring v2">AP</span>',1))
          PY
          git diff --check
      - name: Commit source fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/GameShell.tsx
          git commit -m 'Keep score header compact under narrow landscape and large-score stress'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/scoring-balance-v2
