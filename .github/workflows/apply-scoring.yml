name: Apply scoring balance implementation
on:
  push:
    branches: [fix/scoring-balance-v2]
    paths: ['.github/workflows/apply-scoring.yml', '.scoring-payload/**']
permissions:
  contents: write
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Apply verified scoring patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma, shutil
          parts=sorted(Path('.scoring-payload').glob('part-*.txt'))
          assert len(parts)==5
          raw=lzma.decompress(base64.b64decode(b''.join(p.read_bytes() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='2a6d8b5f8d2bdab45d3a9415054fc897822130f21215872ac04984a27a433fa2'
          changes=json.loads(raw)
          for name, change in changes.items():
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              if change is None:
                  path.unlink(missing_ok=True)
                  continue
              if 'new' in change:
                  assert not path.exists(), name
                  text=change['new']
              else:
                  original=path.read_bytes()
                  assert hashlib.sha256(original).hexdigest()==change['sha'], name
                  lines=original.decode().splitlines(keepends=True)
                  for start,end,replacement in reversed(change['edits']):
                      assert 0<=start<=end<=len(lines), name
                      lines[start:end]=[replacement]
                  text=''.join(lines)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text)
          for name in ['balance-audit.yml','deploy-hotfix.yml','apply-scoring.yml']:
              Path('.github/workflows',name).unlink(missing_ok=True)
          shutil.rmtree('.scoring-payload')
          print('Applied',len(changes),'verified source changes; temporary workflows removed.')
          PY
          git diff --check
      - name: Commit readable implementation to feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement calibrated scoring v2 across 32 games, modes, storage and both backends'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/scoring-balance-v2
      - run: bun install --frozen-lockfile
      - run: bun run quality:scoring
      - run: bun run quality:scoring-migrations
      - run: bunx tsc --noEmit && bunx tsc -p worker/tsconfig.json --noEmit
      - run: bun run build:pages
      - name: Verify scoring browser boundary
        run: SCORING_CHROME_PATH="$(command -v google-chrome)" bun run quality:scoring-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scoring-balance-evidence
          path: balance-report
          retention-days: 7
