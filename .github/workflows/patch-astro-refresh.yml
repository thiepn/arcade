name: Patch Astro Blaster Refresh Rate

on:
  push:
    branches: [fix/astro-refresh-rate]
    paths: [.github/workflows/patch-astro-refresh.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/astro-refresh-rate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify Astro Blaster repair
        shell: bash
        run: |
          python scripts/patch-astro-refresh.py
          rm scripts/patch-astro-refresh.py
          bun install --frozen-lockfile
          bun scripts/audit-astro.ts
          bunx tsc --noEmit
          bun run build
      - name: Commit repaired Astro Blaster source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/AstroBlasterGame.tsx src/lib/astroRuntime.ts scripts/audit-astro.ts scripts/patch-astro-refresh.py
          git commit -m 'Fix Astro Blaster refresh-rate dependent gameplay'
          git push origin HEAD:fix/astro-refresh-rate
