name: Dependency audit

on:
  push:
    branches: [dependency-lockfile-cleanup]
    paths:
      - '.dependency-audit/**'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan direct dependency references
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('package.json').read_text())
          deps = {**manifest.get('dependencies', {}), **manifest.get('devDependencies', {})}
          roots = [p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts and 'node_modules' not in p.parts]
          excluded = {'package.json', 'bun.lock', '.github/workflows/dependency-audit.yml'}

          print('DEPENDENCY REFERENCE REPORT')
          for dep in sorted(deps):
              hits = []
              for path in roots:
                  rel = path.as_posix()
                  if rel in excluded:
                      continue
                  try:
                      text = path.read_text(errors='ignore')
                  except Exception:
                      continue
                  if dep in text:
                      hits.append(rel)
              print(f'{dep}: {", ".join(sorted(set(hits))) if hits else "NO_DIRECT_REFERENCE"}')
          PY
