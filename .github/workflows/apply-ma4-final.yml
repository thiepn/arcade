name: Apply MA4 final hardening

on:
  push:
    branches: [codex/ma4-final-release]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Apply MA4 final hardening' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ma4-final-release
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply and certify MA4
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-ma4-final.py
          python scripts/patch-ma1-audit-for-lazy.py
          python scripts/patch-ma4-types.py
          python scripts/patch-latent-game-types.py
          python scripts/patch-ma4-audit-entry.py
          bun install
          bun install --frozen-lockfile
          bun run quality:games
          bunx tsc --noEmit
          bun run d1:migrate:local
          printf 'CREDENTIAL_PEPPER=ma4-ci-smoke-test-pepper-not-for-production\n' > .dev.vars
          bunx wrangler dev --local --port 8787 > /tmp/micro-arcade-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/v1/health >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/micro-arcade-worker.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/health >/dev/null
          bun worker/smoke-test.mjs
          cleanup
          trap - EXIT
          rm -f .dev.vars
          bun run worker:check
          bun run build
          MA3_EXPECT_BASE=/ bun run quality:ma3
          MA4_EXPECT_BASE=/ bun run quality:ma4
          bun run build:pages
          MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
          MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Complete MA4 performance accessibility and release hardening'
          git push origin HEAD:codex/ma4-final-release
