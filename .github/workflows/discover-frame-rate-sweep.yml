name: Discover Frame Rate Sweep

on:
  push:
    branches: [audit/global-frame-rate-sweep]
    paths:
      - scripts/discover-frame-rate-sweep.ts
      - .github/workflows/discover-frame-rate-sweep.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/global-frame-rate-sweep
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun scripts/discover-frame-rate-sweep.ts
