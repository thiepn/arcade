name: Discover Post-Repair Audit

on:
  push:
    branches: [audit/post-repair-32-sweep]
    paths:
      - scripts/discover-post-repair-audit.ts
      - .github/workflows/discover-post-repair-audit.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/post-repair-32-sweep
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun scripts/discover-post-repair-audit.ts
      - run: bun install --frozen-lockfile
      - run: bun run quality:frame-rate
      - run: bun run quality:release32
      - run: bunx tsc --noEmit
