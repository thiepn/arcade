name: Apply MA1 verified fixes

on:
  push:
    branches: [ma1-game-quality-balance]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ma1-game-quality-balance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply verified catalog and lifecycle fixes
        shell: bash
        run: |
          python3 -c "import base64; exec(base64.b64decode('  '))"
          rm -f .github/workflows/apply-ma1-fixes.yml .github/workflows/ma1-scan.yml
          bun install --frozen-lockfile
          bun run quality:games
          bunx tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix MA1 catalog, mobile input, and lifecycle defects'
          git push origin HEAD:ma1-game-quality-balance
