name: Apply MA1 verified fixes

on:
  push:
    branches: [ma1-game-quality-balance]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ma1-game-quality-balance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply verified catalog and lifecycle fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing expected pattern: {label}')
              return text.replace(old, new, 1)

          # Register the complete orphaned Knife Target game.
          games_path = Path('src/data/games.ts')
          games = games_path.read_text()
          games = replace_once(
              games,
              "import { AstroBlasterGame } from '../games/AstroBlasterGame';\n",
              "import { AstroBlasterGame } from '../games/AstroBlasterGame';\nimport { KnifeTargetGame } from '../games/KnifeTargetGame';\n",
              'KnifeTarget import',
          )
          knife_entry = """  {
            id: 'knifetarget',
            title: 'Knife Target',
            tagline: 'Thread blades into a spinning cyber core.',
            description: 'Throw blades into a rotating target without striking embedded knives or deflector shields. Slice crystals, build multipliers, and survive escalating stages.',
            category: 'Timing',
            sessionLength: '1–3 min',
            accentColor: '#38bdf8',
            accentGlow: 'rgba(56, 189, 248, 0.4)',
            accentBg: 'rgba(56, 189, 248, 0.1)',
            instructions: 'Tap, click, or press Space to throw. Avoid embedded blades and red deflector shields.',
            controlsHint: 'Click / Tap / Space',
            icon: 'Target',
            component: KnifeTargetGame,
          },
"""
          games = replace_once(games, "  {\n    id: 'airhockey',", knife_entry + "  {\n    id: 'airhockey',", 'KnifeTarget registry entry')
          games_path.write_text(games)

          # Keep backend accepted-game rules in lockstep with the cabinet.
          worker_path = Path('worker/src/index.ts')
          worker = worker_path.read_text()
          worker = replace_once(
              worker,
              "'rhythm','tower','pacmaze','flappyaero','roadcross','bubblebuster','astroblaster','laserrope','blockdrop','airhockey',",
              "'rhythm','tower','pacmaze','flappyaero','roadcross','bubblebuster','astroblaster','laserrope','blockdrop','knifetarget','airhockey',",
              'KnifeTarget backend id',
          )
          worker = replace_once(
              worker,
              "  airhockey: { maxScore: 1_000_000, minDurationMs: 250, maxDurationMs: 30 * 60 * 1000 },\n",
              "  knifetarget: { maxScore: 10_000_000, minDurationMs: 500, maxDurationMs: 30 * 60 * 1000 },\n  airhockey: { maxScore: 1_000_000, minDurationMs: 250, maxDurationMs: 30 * 60 * 1000 },\n",
              'KnifeTarget score rule',
          )
          worker_path.write_text(worker)

          # Road Cross: replace fake swipe promise with one unified pointer tap/swipe path.
          road_path = Path('src/games/RoadCrossGame.tsx')
          road = road_path.read_text()
          road = replace_once(
              road,
              "  const setSafeTimeout = useSafeTimeout();\n",
              "  const setSafeTimeout = useSafeTimeout();\n  const pointerStartRef = useRef<{ x: number; y: number } | null>(null);\n",
              'RoadCross pointer ref',
          )
          pattern = re.compile(r"  // Screen tap / click navigation\n  const handleCanvasClick = \(e: React\.MouseEvent<HTMLDivElement>\) => \{.*?\n  \};\n\n  const generateLanesUpTo", re.S)
          replacement = """  // Unified pointer navigation: short press = contextual tap, swipe = cardinal move.
          const handleTapAt = (clientX: number, clientY: number) => {
            if (!containerRef.current) return;
            const rect = containerRef.current.getBoundingClientRect();
            const clickX = clientX - rect.left;
            const clickY = clientY - rect.top;

            const boardWidth = COLS_COUNT * TILE_SIZE;
            const offsetX = (rect.width - boardWidth) / 2;
            const playerScreenX = offsetX + gameStateRef.current.col * TILE_SIZE + TILE_SIZE / 2;

            if (clickY > rect.height * 0.75 && Math.abs(clickX - playerScreenX) < 40) {
              triggerMove(0, -1);
            } else if (clickX < playerScreenX - 35) {
              triggerMove(-1, 0);
            } else if (clickX > playerScreenX + 35) {
              triggerMove(1, 0);
            } else {
              triggerMove(0, 1);
            }
          };

          const handlePointerDown = (e: React.PointerEvent<HTMLDivElement>) => {
            pointerStartRef.current = { x: e.clientX, y: e.clientY };
            e.currentTarget.setPointerCapture?.(e.pointerId);
          };

          const handlePointerUp = (e: React.PointerEvent<HTMLDivElement>) => {
            const start = pointerStartRef.current;
            pointerStartRef.current = null;
            if (!start) {
              handleTapAt(e.clientX, e.clientY);
              return;
            }

            const dx = e.clientX - start.x;
            const dy = e.clientY - start.y;
            const threshold = 24;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < threshold) {
              handleTapAt(e.clientX, e.clientY);
              return;
            }

            if (Math.abs(dx) > Math.abs(dy)) triggerMove(dx > 0 ? 1 : -1, 0);
            else triggerMove(0, dy < 0 ? 1 : -1);
          };

          const handlePointerCancel = () => {
            pointerStartRef.current = null;
          };

          const generateLanesUpTo"""
          road, count = pattern.subn(replacement, road, count=1)
          if count != 1:
              raise SystemExit('missing expected pattern: RoadCross tap handler block')
          road = replace_once(
              road,
              "      onClick={handleCanvasClick}\n",
              "      onPointerDown={handlePointerDown}\n      onPointerUp={handlePointerUp}\n      onPointerCancel={handlePointerCancel}\n",
              'RoadCross render input',
          )
          road_path.write_text(road)

          # Shared shell: pause hidden tabs, avoid held-key repeat toggles, suppress game-surface browser gestures.
          shell_path = Path('src/components/GameShell.tsx')
          shell = shell_path.read_text()
          visibility = """
          // Backgrounding or locking a device must never let a live run advance unseen.
          useEffect(() => {
            const handleVisibilityChange = () => {
              if (document.hidden && !gameOverHandledRef.current) setIsPaused(true);
            };
            document.addEventListener('visibilitychange', handleVisibilityChange);
            return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
          }, []);

"""
          shell = replace_once(shell, "  // Global game shell keyboard shortcuts\n", visibility + "  // Global game shell keyboard shortcuts\n", 'visibility pause effect')
          shell = replace_once(
              shell,
              "    const handleGlobalKey = (e: KeyboardEvent) => {\n",
              "    const handleGlobalKey = (e: KeyboardEvent) => {\n      if (e.repeat) return;\n",
              'repeat-safe shell shortcuts',
          )
          shell = replace_once(
              shell,
              "      >\n        <div\n          className={`relative w-full h-full bg-[#0A0A0B] overflow-hidden flex items-center justify-center transition-all ${",
              "        style={{ touchAction: 'none', overscrollBehavior: 'none' }}\n      >\n        <div\n          className={`relative w-full h-full bg-[#0A0A0B] overflow-hidden flex items-center justify-center transition-all ${",
              'game stage gesture suppression',
          )
          shell_path.write_text(shell)
          PY

          rm -f .github/workflows/apply-ma1-fixes.yml .github/workflows/ma1-scan.yml

          bun install --frozen-lockfile
          bun run quality:games
          bunx tsc --noEmit

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix MA1 catalog, mobile input, and lifecycle defects'
          git push origin HEAD:ma1-game-quality-balance
