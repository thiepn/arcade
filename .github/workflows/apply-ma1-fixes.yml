name: Apply MA1 verified fixes

on:
  push:
    branches: [ma1-game-quality-balance]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ma1-game-quality-balance
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply verified MA1 fixes
        run: bun scripts/apply-ma1-fixes.mjs
      - run: bun install --frozen-lockfile
      - run: bun run quality:games
      - run: bunx tsc --noEmit
      - name: Commit verified MA1 fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix MA1 catalog, mobile input, and lifecycle defects'
          git push origin HEAD:ma1-game-quality-balance
