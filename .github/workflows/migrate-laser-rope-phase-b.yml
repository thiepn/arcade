name: Apply Laser Rope Reflex Phase B

on:
  push:
    branches:
      - fix/desktop-gameplay-32
    paths:
      - scripts/migrate-laser-rope-phase-b.mjs
      - scripts/audit-laser-rope-feedback.ts
      - src/lib/laserRopeFeedback.ts
      - .github/workflows/migrate-laser-rope-phase-b.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-gameplay-32
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: node scripts/migrate-laser-rope-phase-b.mjs
      - run: bun run quality:games
      - run: bun run quality:desktop
      - run: bun run quality:blade
      - run: bun run quality:pinball
      - run: bun run quality:chrono
      - run: bun run quality:shortcuts
      - run: bun run quality:pac
      - run: bun run quality:mobile
      - run: bun run quality:rope
      - run: bun scripts/audit-laser-rope-feedback.ts
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: MA3_EXPECT_BASE=/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/ bun run quality:ma4
      - run: bun run build:pages
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - run: git diff --check
      - name: Commit Laser Rope Reflex Phase B
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/LaserRopeGame.tsx
          if git diff --cached --quiet; then
            echo "No Laser Rope Reflex Phase B changes were produced."
            exit 1
          fi
          git commit -m "Polish Laser Rope Reflex Phase B feedback"
          git push origin HEAD:fix/desktop-gameplay-32
