name: Verify P3 browser stabilization

on:
  push:
    branches: [gameplay/p3-browser-stabilization]
    paths:
      - .github/workflows/patch-p3-stability.yml

permissions:
  contents: write

jobs:
  browser-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply stabilization patch
        run: |
          python scripts/patch-p3-browser-stability.py
          rm scripts/patch-p3-browser-stability.py
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Run 64-session browser certification
        shell: bash
        run: |
          set -euo pipefail
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/p3-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/p3-preview.log
              exit 1
            fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo 'Chrome executable not found on runner'
            exit 1
          fi
          P3_CHROME_PATH="$chrome" bun run quality:browser-p3
      - name: Commit verified stabilization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-browser-gameplay-p3.mjs scripts/patch-p3-browser-stability.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Stabilize P3 browser certification'
          git push origin HEAD:gameplay/p3-browser-stabilization
# trigger: deterministic-pause-and-gameplay-long-task-scope
