name: Patch Global Frame Rate Normalization

on:
  push:
    branches: [audit/global-frame-rate-sweep]
    paths: [.github/workflows/patch-global-frame-rate.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/global-frame-rate-sweep
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify global frame-rate sweep
        shell: bash
        run: |
          python scripts/patch-global-frame-rate.py
          rm scripts/patch-global-frame-rate.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit-frame-rate-global.ts')
          s = p.read_text()
          s = s.replace(
              "const usesShared = source.includes('getArcadeStepBatch') || /get(?:Astro|Blade|Gravity|OneLine|Slingshot|Tower|Vanguard|Drift)PhysicsStepBatch/.test(source);",
              "const usesShared = source.includes('getArcadeStepBatch') || /get(?:Astro|Gravity|OneLine|Slingshot|Tower|Vanguard|Drift)PhysicsStepBatch/.test(source) || source.includes('getBladeSimulationStepBatch');",
          )
          s = s.replace("for (const file of games) {\n  const source = read(`src/games/${file}`);\n  assert(!/\\bsetInterval\\s*\\(/.test(source), `${file} contains raw setInterval gameplay timing`);\n  assert(!/\\bsetTimeout\\s*\\(/.test(source), `${file} contains raw setTimeout gameplay timing; use managed/gameplay timing`);\n}", "for (const file of [...fixedStepGames, ...elapsedGames]) {\n  const source = read(`src/games/${file}`);\n  assert(!/\\bsetInterval\\s*\\(/.test(source), `${file} contains raw setInterval gameplay timing`);\n  assert(!/\\bsetTimeout\\s*\\(/.test(source), `${file} contains raw setTimeout gameplay timing; use managed/gameplay timing`);\n}")
          p.write_text(s)
          PY
          bun install --frozen-lockfile
          bun run quality:frame-rate
          bunx tsc --noEmit
          bun run build
      - name: Commit normalized gameplay clocks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/BreakoutGame.tsx src/games/ChainGame.tsx src/games/DodgeGame.tsx src/games/StackGame.tsx src/games/PacMazeGame.tsx src/games/RhythmGame.tsx src/games/OrbitGame.tsx src/games/RoadCrossGame.tsx src/games/PulseGame.tsx src/games/SnakeGame.tsx src/lib/frameRateRuntime.ts scripts/audit-frame-rate-global.ts scripts/audit-release-32.ts package.json scripts/patch-global-frame-rate.py
          git commit -m 'Normalize shared gameplay clocks across arcade roster'
          git push origin HEAD:audit/global-frame-rate-sweep
