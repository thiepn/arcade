name: Patch Post-Repair Runtime

on:
  push:
    branches: [audit/post-repair-32-sweep]
    paths: [.github/workflows/patch-post-repair-runtime.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/post-repair-32-sweep
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify lifecycle/mobile repairs
        shell: bash
        run: |
          set -euo pipefail
          # Retry after calibrating transient lifecycle detection.
          python scripts/patch-post-repair-runtime.py
          rm scripts/patch-post-repair-runtime.py
          rm scripts/discover-post-repair-audit.ts
          rm .github/workflows/discover-post-repair-audit.yml
          rm .github/workflows/patch-post-repair-runtime.yml
          bun install --frozen-lockfile
          bun run quality:lifecycle
          bun run quality:mobile
          bun run quality:frame-rate
          bun run quality:release32
          bunx tsc --noEmit
          bun run build
      - name: Commit verified post-repair fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix post-repair lifecycle and mobile layout regressions'
          git push origin HEAD:audit/post-repair-32-sweep
