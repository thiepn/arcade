name: Deploy Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hotfix.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - run: bun install --frozen-lockfile
      - run: bun run build:pages
        env:
          VITE_LEADERBOARD_API_URL: https://hycegznamzjhwinegaai.supabase.co/functions/v1/micro-arcade-leaderboards
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
