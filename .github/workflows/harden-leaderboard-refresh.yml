name: Harden leaderboard refresh flow

on:
  push:
    branches: [cloudflare-leaderboards]
    paths:
      - '.leaderboard-hardening/**'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deduplicate guest creation and make live refresh explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          board = Path('src/lib/leaderboards.ts')
          text = board.read_text()

          old = "const LEGACY_FAKE_KEY = 'micro_arcade_global_leaderboards_v2';\nexport const LEADERBOARD_UPDATED_EVENT = 'micro-arcade-leaderboards-updated';"
          new = "const LEGACY_FAKE_KEY = 'micro_arcade_global_leaderboards_v2';\nexport const LEADERBOARD_UPDATED_EVENT = 'micro-arcade-leaderboards-updated';\nlet guestCreationPromise: Promise<string | null> | null = null;"
          assert old in text
          text = text.replace(old, new, 1)

          old = "async function ensureGuestCredential(): Promise<string | null> {\n  const existing = getCredential();\n  if (existing) return existing;\n  const base = apiBase();\n  if (!base || typeof window === 'undefined') return null;\n  const response = await fetch(`${base}/v1/guest`, {\n    method: 'POST',\n    headers: { 'content-type': 'application/json' },\n    body: '{}',\n  });\n  if (!response.ok) throw new Error(`Guest creation failed (${response.status})`);\n  const data = await response.json() as { credential: string };\n  localStorage.setItem(GUEST_KEY, data.credential);\n  return data.credential;\n}"
          new = "async function ensureGuestCredential(): Promise<string | null> {\n  const existing = getCredential();\n  if (existing) return existing;\n  const base = apiBase();\n  if (!base || typeof window === 'undefined') return null;\n  if (!guestCreationPromise) {\n    guestCreationPromise = (async () => {\n      const response = await fetch(`${base}/v1/guest`, {\n        method: 'POST',\n        headers: { 'content-type': 'application/json' },\n        body: '{}',\n      });\n      if (!response.ok) throw new Error(`Guest creation failed (${response.status})`);\n      const data = await response.json() as { credential: string };\n      localStorage.setItem(GUEST_KEY, data.credential);\n      return data.credential;\n    })();\n  }\n  try {\n    return await guestCreationPromise;\n  } finally {\n    guestCreationPromise = null;\n  }\n}"
          assert old in text
          text = text.replace(old, new, 1)

          text = text.replace("  if (isLiveLeaderboardConfigured()) void refreshGameLeaderboard(gameId).catch(() => {});\n", "", 1)
          text = text.replace("  if (isLiveLeaderboardConfigured()) void refreshOverallLeaderboard().catch(() => {});\n", "", 1)
          board.write_text(text)

          stats = Path('src/components/StatsModal.tsx')
          text = stats.read_text()
          old = "  simulateLiveCompetition,\n  resetAllLeaderboards,"
          new = "  simulateLiveCompetition,\n  refreshGameLeaderboard,\n  refreshOverallLeaderboard,\n  isLiveLeaderboardConfigured,\n  resetAllLeaderboards,"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  useEffect(() => {\n    const handleLeaderboardUpdate = () => setRefreshTick((tick) => tick + 1);\n    window.addEventListener(LEADERBOARD_UPDATED_EVENT, handleLeaderboardUpdate);\n    return () => window.removeEventListener(LEADERBOARD_UPDATED_EVENT, handleLeaderboardUpdate);\n  }, []);\n\n  // Achievement filters & search"
          new = "  useEffect(() => {\n    const handleLeaderboardUpdate = () => setRefreshTick((tick) => tick + 1);\n    window.addEventListener(LEADERBOARD_UPDATED_EVENT, handleLeaderboardUpdate);\n    return () => window.removeEventListener(LEADERBOARD_UPDATED_EVENT, handleLeaderboardUpdate);\n  }, []);\n\n  useEffect(() => {\n    if (activeTab !== 'leaderboards' || !isLiveLeaderboardConfigured()) return;\n    if (leaderboardScope === 'perGame') {\n      void refreshGameLeaderboard(selectedGameId).catch((error) => {\n        console.warn('Unable to refresh game leaderboard:', error);\n      });\n    } else {\n      void refreshOverallLeaderboard().catch((error) => {\n        console.warn('Unable to refresh overall leaderboard:', error);\n      });\n    }\n  }, [activeTab, leaderboardScope, selectedGameId]);\n\n  // Achievement filters & search"
          assert old in text
          stats.write_text(text.replace(old, new, 1))
          PY
          rm -rf .leaderboard-hardening
          git diff --check
          git config user.name "thiepn"
          git config user.email "junsosmart@gmail.com"
          git add src/lib/leaderboards.ts src/components/StatsModal.tsx .leaderboard-hardening
          git commit -m "Harden guest creation and leaderboard refresh flow"
          git push origin HEAD:cloudflare-leaderboards
