name: Deploy Production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: true

env:
  LEADERBOARD_API_URL: https://hycegznamzjhwinegaai.supabase.co/functions/v1/micro-arcade-leaderboards
  PRODUCTION_ORIGIN: https://thiepn.dev

jobs:
  verify-backend:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify leaderboard health, CORS and database access
        shell: bash
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          normalized_headers="$(mktemp)"
          body="$(mktemp)"
          cleanup() { rm -f "$headers" "$normalized_headers" "$body"; }
          trap cleanup EXIT

          status="$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' -X OPTIONS "$LEADERBOARD_API_URL/v1/guest" \
            -H "Origin: $PRODUCTION_ORIGIN" \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type')"
          tr -d '\r' < "$headers" > "$normalized_headers"
          test "$status" = '204'
          grep -Fqi "access-control-allow-origin: $PRODUCTION_ORIGIN" "$normalized_headers"

          curl -fsS "$LEADERBOARD_API_URL/v1/health" -H "Origin: $PRODUCTION_ORIGIN" > "$body"
          grep -q '"ok":true' "$body"
          grep -q '"backend":"supabase"' "$body"

          curl -fsS "$LEADERBOARD_API_URL/v1/leaderboards/overall?limit=1" -H "Origin: $PRODUCTION_ORIGIN" > "$body"
          grep -q '"entries"' "$body"
          grep -q '"totalCompetitors"' "$body"
          echo 'Production Supabase leaderboard backend verified.'

  build:
    if: github.event.workflow_run.conclusion == 'success'
    needs: verify-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: bun install --frozen-lockfile
      - run: bun run build:pages
        env:
          VITE_LEADERBOARD_API_URL: https://hycegznamzjhwinegaai.supabase.co/functions/v1/micro-arcade-leaderboards
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  certify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Live Pages responsive + 32-game smoke
        shell: bash
        env:
          P3_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          HEADER_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          P3_QUICK: '1'
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo 'Chrome executable not found on runner'
            exit 1
          fi
          HEADER_CHROME_PATH="$chrome" bun scripts/audit-responsive-header.mjs
          P3_CHROME_PATH="$chrome" bun run quality:browser-p3
