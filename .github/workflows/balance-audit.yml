name: Scoring balance audit
on:
  push:
    branches: [fix/scoring-balance-v2]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Export reproducible audit workspace
        run: |
          mkdir -p /tmp/balance-workspace
          git archive HEAD -o /tmp/balance-workspace/source.tar
          tar -czf /tmp/balance-workspace/dependencies.tar.gz node_modules
          cp "$(command -v bun)" /tmp/balance-workspace/bun
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: balance-workspace
          path: /tmp/balance-workspace
          retention-days: 1
