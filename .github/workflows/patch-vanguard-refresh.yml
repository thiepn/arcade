name: Patch Galaxy Vanguard Refresh Rate

on:
  push:
    branches: [fix/vanguard-refresh-rate]
    paths: [.github/workflows/patch-vanguard-refresh.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/vanguard-refresh-rate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify Galaxy Vanguard repair
        shell: bash
        run: |
          python scripts/patch-vanguard-refresh.py
          rm scripts/patch-vanguard-refresh.py
          bun install --frozen-lockfile
          bun run quality:vanguard
          bunx tsc --noEmit
          bun run build
      - name: Commit repaired Galaxy Vanguard source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/VanguardGame.tsx src/lib/vanguardRuntime.ts scripts/audit-vanguard.ts scripts/audit-release-32.ts package.json scripts/patch-vanguard-refresh.py
          git commit -m 'Fix Galaxy Vanguard refresh-rate dependent gameplay'
          git push origin HEAD:fix/vanguard-refresh-rate
