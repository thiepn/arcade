name: P35 Operating Effectiveness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'ops/p31-backup-recovery-cert.pem'
      - 'ops/p34-security-controls.json'
      - 'ops/p35-operating-effectiveness-policy.json'
      - 'ops/p36-observation-integrity-policy.json'
      - 'scripts/audit-production-p27.mjs'
      - 'scripts/audit-reliability-p28.mjs'
      - 'scripts/audit-incident-p29.mjs'
      - 'scripts/audit-continuity-p30.mjs'
      - 'scripts/audit-operations-p2*.mjs'
      - 'scripts/audit-operations-p3*.mjs'
      - 'scripts/p29-*'
      - 'scripts/p30-*'
      - 'scripts/p31-*'
      - 'scripts/p32-*'
      - 'scripts/p33-*'
      - 'scripts/p34-*'
      - 'scripts/p35-*'
      - 'scripts/p36-*'
      - 'scripts/test-incident-diagnostics-p29.mjs'
      - 'scripts/test-disaster-recovery-p30.mjs'
      - 'scripts/test-fullstack-recovery-p32.mjs'
      - 'scripts/test-offline-recovery-p33.mjs'
      - 'scripts/test-operating-effectiveness-p35.mjs'
      - 'scripts/test-observation-integrity-p36.mjs'
      - 'shared/scoringProtocol.ts'
      - 'worker/src/index.ts'
      - 'supabase/functions/micro-arcade-leaderboards/index.ts'
      - 'supabase/functions/micro-arcade-p31-backup-export/index.ts'
      - 'docs/P35_OPERATING_EFFECTIVENESS.md'
      - 'docs/P36_OBSERVATION_INTEGRITY.md'
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: p35-operating-effectiveness
  cancel-in-progress: false

jobs:
  effectiveness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Verify P35 static contract
        run: bun scripts/audit-operations-p35.mjs
      - name: Run P35 operating-effectiveness assessment and audit dry-run
        run: bun scripts/p35-operating-effectiveness.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P35_REPORT_DIR: p35-report
          P35_LIVE: '1'
          P35_MUTATE_ISSUES: '1'
      - name: Upload P35 evidence package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p35-operating-effectiveness-${{ github.run_id }}
          path: p35-report
          retention-days: 90
          if-no-files-found: warn
