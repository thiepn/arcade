name: Patch P0 gameplay fairness

on:
  push:
    branches: [gameplay/p0-core-fairness]
    paths:
      - scripts/patch-gameplay-p0.py
      - .github/workflows/patch-gameplay-p0.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply P0 gameplay patch
        run: |
          python scripts/patch-gameplay-p0.py
          rm scripts/patch-gameplay-p0.py
      - run: bun install --frozen-lockfile
      - run: bun run quality:gameplay-p0
      - run: bun run quality:games
      - run: bun run quality:frame-rate
      - run: bun run quality:hud-render
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bun run quality:puck
      - run: bun run quality:shortcuts
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified P0 gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/MergeGame.tsx src/games/OrbitGame.tsx src/games/RhythmGame.tsx src/games/AirHockeyGame.tsx src/data/games.ts src/lib/rhythmSongs.ts src/lib/mergeRules.ts src/lib/rhythmTiming.ts src/lib/airHockeyFairness.ts scripts/audit-gameplay-p0.ts scripts/audit-release-32.ts package.json scripts/patch-gameplay-p0.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix P0 gameplay fairness issues'
          git push origin HEAD:gameplay/p0-core-fairness
