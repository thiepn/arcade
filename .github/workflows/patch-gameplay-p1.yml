name: Patch P1 gameplay depth

on:
  push:
    branches: [gameplay/p1-depth-upgrade]
    paths:
      - scripts/patch-gameplay-p1-meta.py
      - .github/workflows/patch-gameplay-p1.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply P1 metadata and certification wiring
        run: |
          python scripts/patch-gameplay-p1-meta.py
          rm scripts/patch-gameplay-p1-meta.py
      - run: bun install --frozen-lockfile
      - run: bun run quality:gameplay-p1
      - run: bun run quality:gameplay-p0
      - run: bun run quality:games
      - run: bun run quality:hud-render
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified P1 gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/PerfectStopGame.tsx src/games/ReactionGame.tsx src/lib/perfectStopGameplay.ts src/lib/reactionGameplay.ts src/data/games.ts scripts/audit-gameplay-p1.ts scripts/audit-release-32.ts package.json .github/workflows/ci.yml scripts/patch-gameplay-p1-meta.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Upgrade P1 gameplay depth'
          git push origin HEAD:gameplay/p1-depth-upgrade
