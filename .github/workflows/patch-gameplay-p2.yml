name: Patch P2 replay depth

on:
  push:
    branches: [gameplay/p2-replay-depth]
    paths:
      - scripts/patch-gameplay-p2.py
      - .github/workflows/patch-gameplay-p2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply P2 gameplay patch
        run: |
          python scripts/fix-p2-patch-ids.py
          rm scripts/patch-gameplay-p2.py scripts/fix-p2-patch-ids.py
      - run: bun install --frozen-lockfile
      - run: bun run quality:gameplay-p2
      - run: bun run quality:gameplay-p1
      - run: bun run quality:gameplay-p0
      - run: bun run quality:games
      - run: bun run quality:typerush
      - run: bun run quality:pac
      - run: bun run quality:knife
      - run: bun run quality:rail
      - run: bun run quality:hud-render
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified P2 gameplay changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/MatrixGame.tsx src/games/TypeRushGame.tsx src/games/NeonRailShiftGame.tsx src/games/KnifeTargetGame.tsx src/games/PacMazeGame.tsx src/data/games.ts package.json scripts/audit-release-32.ts scripts/patch-gameplay-p2.py scripts/fix-p2-patch-ids.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Upgrade P2 replay depth'
          git push origin HEAD:gameplay/p2-replay-depth
