name: Apply responsive repair
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  apply:
    if: github.event.pull_request.number == 76 && github.event.pull_request.head.ref == 'fix/responsive-ui-audit' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply reviewed source without changing workflow files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tools/ui-repair/part0 ]; then exit 0; fi
          cat tools/ui-repair/part{0,1,2,3,4} | base64 --decode | gzip --decompress > /tmp/responsive-ui.patch
          echo '2cd0867dc16f5ceb01706b6c2c841a75ee85f38ee590995818bed3b3db5e9757  /tmp/responsive-ui.patch' | sha256sum --check
          git rm scripts/audit-ui-geometry.mjs
          git apply --check /tmp/responsive-ui.patch
          git apply /tmp/responsive-ui.patch
          git rm tools/ui-repair/part{0,1,2,3,4} tools/responsive-ui.patch.gz.b64
          git add src scripts/audit-ui-geometry.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair responsive game boards, chrome, dialogs and regression coverage'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/responsive-ui-audit
