name: Apply leaderboard client wiring

on:
  push:
    branches: [cloudflare-leaderboards]
    paths:
      - '.leaderboard-wiring/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire game sessions and live leaderboard refresh
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          shell = Path('src/components/GameShell.tsx')
          text = shell.read_text()
          old = "import { haptics } from '../lib/haptics';\nimport confetti from 'canvas-confetti';"
          new = "import { haptics } from '../lib/haptics';\nimport { beginLeaderboardSession, submitLeaderboardScore, type LeaderboardPlaySession } from '../lib/leaderboards';\nimport confetti from 'canvas-confetti';"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  const activeSessionKeyRef = useRef(1);\n  const gameOverHandledRef = useRef(false);"
          new = "  const activeSessionKeyRef = useRef(1);\n  const gameOverHandledRef = useRef(false);\n  const leaderboardSessionRef = useRef<LeaderboardPlaySession | null>(null);\n  const leaderboardSessionPromiseRef = useRef<Promise<LeaderboardPlaySession | null> | null>(null);"
          assert old in text
          text = text.replace(old, new, 1)

          old = "  const [gameSessionKey, setGameSessionKey] = useState(1);\n  activeSessionKeyRef.current = gameSessionKey;\n\n  const handleRestart"
          new = "  const [gameSessionKey, setGameSessionKey] = useState(1);\n  activeSessionKeyRef.current = gameSessionKey;\n\n  useEffect(() => {\n    let cancelled = false;\n    leaderboardSessionRef.current = null;\n    const sessionKey = gameSessionKey;\n    const request = beginLeaderboardSession(game.id);\n    leaderboardSessionPromiseRef.current = request;\n    void request.then((session) => {\n      if (!cancelled && activeSessionKeyRef.current === sessionKey) {\n        leaderboardSessionRef.current = session;\n      }\n    }).catch((error) => {\n      console.warn('Unable to start live leaderboard session:', error);\n    });\n    return () => {\n      cancelled = true;\n    };\n  }, [game.id, gameSessionKey]);\n\n  const handleRestart"
          assert old in text
          text = text.replace(old, new, 1)

          old = "      const { isNewHighScore } = onSaveScore(game.id, safeFinalScore);\n      const newBest = Math.max(bestScore, safeFinalScore);"
          new = "      const { isNewHighScore } = onSaveScore(game.id, safeFinalScore);\n      const newBest = Math.max(bestScore, safeFinalScore);\n\n      const submitRemoteScore = (session: LeaderboardPlaySession | null) => {\n        if (session) void submitLeaderboardScore(session, safeFinalScore);\n      };\n      if (leaderboardSessionRef.current) {\n        submitRemoteScore(leaderboardSessionRef.current);\n      } else if (leaderboardSessionPromiseRef.current) {\n        void leaderboardSessionPromiseRef.current.then(submitRemoteScore).catch(() => {});\n      }"
          assert old in text
          text = text.replace(old, new, 1)
          shell.write_text(text)

          stats = Path('src/components/StatsModal.tsx')
          text = stats.read_text()
          old = "  GlobalOverallEntry,\n} from '../lib/leaderboards';"
          new = "  GlobalOverallEntry,\n  LEADERBOARD_UPDATED_EVENT,\n} from '../lib/leaderboards';"
          assert old in text
          text = text.replace(old, new, 1)
          old = "  const [refreshTick, setRefreshTick] = useState(0);\n  const setSafeTimeout = useSafeTimeout();\n\n  // Achievement filters"
          new = "  const [refreshTick, setRefreshTick] = useState(0);\n  const setSafeTimeout = useSafeTimeout();\n\n  useEffect(() => {\n    const handleLeaderboardUpdate = () => setRefreshTick((tick) => tick + 1);\n    window.addEventListener(LEADERBOARD_UPDATED_EVENT, handleLeaderboardUpdate);\n    return () => window.removeEventListener(LEADERBOARD_UPDATED_EVENT, handleLeaderboardUpdate);\n  }, []);\n\n  // Achievement filters"
          assert old in text
          text = text.replace(old, new, 1)
          stats.write_text(text)
          PY
          rm -rf .leaderboard-wiring
          git diff --check
          git config user.name "thiepn"
          git config user.email "junsosmart@gmail.com"
          git add src/components/GameShell.tsx src/components/StatsModal.tsx .leaderboard-wiring
          git commit -m "Wire live leaderboard sessions into gameplay"
          git push origin HEAD:cloudflare-leaderboards
