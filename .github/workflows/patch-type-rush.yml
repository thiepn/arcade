name: Patch Type Rush

on:
  push:
    branches: [fix/type-rush-input-performance]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/type-rush-input-performance
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply Type Rush repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/games/TypeRushGame.tsx')
          s = p.read_text()
          old = "import { useSafeTimeout } from '../hooks/useGameLoop';\n"
          new = "import { useSafeTimeout } from '../hooks/useGameLoop';\nimport {\n  TYPE_RUSH_WORD_RENDER_INTERVAL_MS,\n  TYPE_RUSH_WPM_RENDER_INTERVAL_MS,\n  shouldSyncTypeRushUi,\n} from '../lib/typeRushRuntime';\n"
          if old not in s:
              raise SystemExit('Type Rush import anchor not found')
          s = s.replace(old, new, 1)
          old = "    let animationId: number;\n    let lastTime = performance.now();\n"
          new = "    let animationId: number;\n    let lastTime = performance.now();\n    let lastWordRenderSync = lastTime;\n    let lastWpmRenderSync = lastTime;\n"
          if old not in s:
              raise SystemExit('Type Rush RAF setup anchor not found')
          s = s.replace(old, new, 1)
          old = "        // Live WPM calculation\n        if (state.gameTime > 2) {\n          const currentWpm = Math.round(\n            (state.charsTyped / 5) / (state.gameTime / 60)\n          );\n          setWpm(currentWpm);\n        }\n"
          new = "        // WPM is display-only data; update it at a bounded cadence instead of every RAF.\n        if (\n          state.gameTime > 2 &&\n          shouldSyncTypeRushUi(\n            currentTime,\n            lastWpmRenderSync,\n            TYPE_RUSH_WPM_RENDER_INTERVAL_MS,\n          )\n        ) {\n          const currentWpm = Math.round(\n            (state.charsTyped / 5) / (state.gameTime / 60)\n          );\n          setWpm(currentWpm);\n          lastWpmRenderSync = currentTime;\n        }\n"
          if old not in s:
              raise SystemExit('Type Rush WPM block not found')
          s = s.replace(old, new, 1)
          old = "        setWords([...state.words]);\n      }\n\n      animationId = requestAnimationFrame(loop);\n"
          new = "        // Falling-word motion stays time-based, while React rendering is capped at 30 Hz.\n        if (\n          shouldSyncTypeRushUi(\n            currentTime,\n            lastWordRenderSync,\n            TYPE_RUSH_WORD_RENDER_INTERVAL_MS,\n          )\n        ) {\n          setWords([...state.words]);\n          lastWordRenderSync = currentTime;\n        }\n      }\n\n      animationId = requestAnimationFrame(loop);\n"
          if old not in s:
              raise SystemExit('Type Rush render sync block not found')
          s = s.replace(old, new, 1)
          old = "            <div\n              key={w.id}\n              onClick={(e) => {\n                e.stopPropagation();\n                focusDeviceKeyboard();\n                if (w.word[w.typedIndex]) {\n                  handleKeyInput(w.word[w.typedIndex]);\n                }\n              }}\n              className={`absolute -translate-x-1/2 transition-all duration-75 px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl font-mono-arcade text-xs sm:text-sm font-bold tracking-wider border shadow-xl flex items-center gap-1.5 cursor-pointer select-none ${\n"
          new = "            <div\n              key={w.id}\n              className={`absolute pointer-events-none -translate-x-1/2 transition-all duration-75 px-3 py-1 sm:px-3.5 sm:py-1.5 rounded-xl font-mono-arcade text-xs sm:text-sm font-bold tracking-wider border shadow-xl flex items-center gap-1.5 cursor-default select-none ${\n"
          if old not in s:
              raise SystemExit('Type Rush click-to-autotype block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-type-rush.yml
          bun install --frozen-lockfile
          bun run quality:typerush
          bun run quality:release32
          bunx tsc --noEmit
      - name: Commit repaired Type Rush
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Type Rush input exploit and render cadence'
          git push origin HEAD:fix/type-rush-input-performance
