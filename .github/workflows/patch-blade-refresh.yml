name: Patch Laser Blade Refresh Rate

on:
  push:
    branches: [fix/blade-refresh-rate]
    paths: [.github/workflows/patch-blade-refresh.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/blade-refresh-rate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify Laser Blade repair
        shell: bash
        run: |
          python scripts/patch-blade-refresh.py
          rm scripts/patch-blade-refresh.py
          bun install --frozen-lockfile
          bun run quality:blade
          bunx tsc --noEmit
          bun run build
      - name: Commit repaired Laser Blade source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Laser Blade refresh-rate dependent gameplay'
          git push origin HEAD:fix/blade-refresh-rate
