name: Discover HUD render performance

on:
  push:
    branches: [perf/hud-render-pass]
    paths-ignore:
      - hud-render-performance-report.txt

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan canvas game render hot paths
        run: python scripts/discover-hud-render-performance.py
      - name: Commit discovery report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hud-render-performance-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record HUD render performance discovery'
          git push origin HEAD:perf/hud-render-pass
