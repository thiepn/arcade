name: P12 Next Mastery Trio Patch

on:
  push:
    branches: [gameplay/p12-next-mastery-trio]

permissions:
  contents: write

jobs:
  patch-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gameplay/p12-next-mastery-trio
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Apply P12 gameplay patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/patch-p12.py')
          text = p.read_text()
          text = text.replace(
              "import { getFrameInvariantBlend } from '../lib/frameRateRuntime';\\n",
              "import { useGameLoop, useSafeTimeout, useRenderPublishedState } from '../hooks/useGameLoop';\\n",
              1,
          )
          text = text.replace(
              "import { getFrameInvariantBlend } from '../lib/frameRateRuntime';\\nimport {\\n",
              "import { useGameLoop, useSafeTimeout, useRenderPublishedState } from '../hooks/useGameLoop';\\nimport {\\n",
              1,
          )
          p.write_text(text)
          PY
          python scripts/patch-p12.py
          python - <<'PY'
          from pathlib import Path
          p = Path('src/data/games.ts')
          text = p.read_text()
          old = "controlsHint: 'Jump: Space/W/↑ • Slide: S/↓ • F/Shift: Redline • Tap',"
          new = "controlsHint: 'Jump: Space / W / ↑ • Slide: S / ↓ • Tap Buttons',"
          if old not in text:
              raise SystemExit('P12/Phase C Laser Rope controls marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - run: bun install --frozen-lockfile
      - run: bun scripts/audit-gameplay-p12.ts
      - run: bun run quality:games
      - run: bun run quality:tower
      - run: bun run quality:rope
      - run: bun run quality:rope-feedback
      - run: bun run quality:rope-phase-c
      - run: bun run quality:frame-rate
      - run: bun run quality:hud-render
      - run: bun run quality:gameplay-p0
      - run: bun run quality:gameplay-p1
      - run: bun run quality:gameplay-p2
      - run: bun run quality:gameplay-p4
      - run: bun run quality:gameplay-p5
      - run: bun run quality:gameplay-p6
      - run: bun run quality:gameplay-p7
      - run: bun run quality:gameplay-p8
      - run: bun run quality:gameplay-p9
      - run: bun run quality:gameplay-p10
      - run: bun run quality:gameplay-p11
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified P12 source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/LaserRopeGame.tsx src/games/TowerGame.tsx src/games/ChainGame.tsx src/data/games.ts
          if git diff --cached --quiet; then
            echo 'No P12 source changes to commit'
            exit 1
          fi
          git commit -m 'Elevate Laser Rope Tower and Chain mastery'
          git push origin HEAD:gameplay/p12-next-mastery-trio
