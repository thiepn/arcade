name: P6 New Bottom Three Patch

on:
  push:
    branches: [gameplay/p6-new-bottom-three]

permissions:
  contents: write

jobs:
  patch-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gameplay/p6-new-bottom-three
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply P6 gameplay patch
        run: python scripts/patch-p6.py
      - run: bun install --frozen-lockfile
      - run: bun run quality:gameplay-p6
      - run: bun run quality:roadcross
      - run: bun run quality:games
      - run: bun run quality:frame-rate
      - run: bun run quality:hud-render
      - run: bun run quality:gameplay-p0
      - run: bun run quality:gameplay-p1
      - run: bun run quality:gameplay-p2
      - run: bun run quality:gameplay-p4
      - run: bun run quality:gameplay-p5
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified P6 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/lib/perfectStopGameplay.ts \
            src/games/ReactionGame.tsx \
            src/games/PerfectStopGame.tsx \
            src/games/RoadCrossGame.tsx \
            src/data/games.ts \
            package.json \
            scripts/audit-release-32.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Elevate Reaction Perfect Stop and Cyber Crosser'
          git push origin HEAD:gameplay/p6-new-bottom-three
