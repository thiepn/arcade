name: Apply Game 32 Roster Migration

on:
  push:
    branches:
      - fix/desktop-gameplay-32
    paths:
      - src/games/NeonRailShiftGame.tsx
      - src/lib/neonRailShift.ts
      - scripts/audit-neon-rail-shift.ts
      - scripts/migrate-game-32.mjs
      - .github/workflows/migrate-game-32.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-gameplay-32
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: node scripts/migrate-game-32.mjs
      - run: bun run quality:games
      - run: bun run quality:desktop
      - run: bun run quality:blade
      - run: bun run quality:pinball
      - run: bun run quality:chrono
      - run: bun run quality:shortcuts
      - run: bun run quality:pac
      - run: bun run quality:mobile
      - run: bun run quality:rope
      - run: bun run quality:rope-feedback
      - run: bun run quality:rope-phase-c
      - run: bun run quality:blockdrop
      - run: bun run quality:knife
      - run: bun run quality:puck
      - run: bun run quality:rail
      - run: bunx tsc --noEmit
      - run: bun run d1:migrate:local
      - name: Smoke-test Worker API
        shell: bash
        run: |
          set -euo pipefail
          printf 'CREDENTIAL_PEPPER=ci-smoke-test-pepper-not-for-production\n' > .dev.vars
          bunx wrangler dev --local --port 8787 > /tmp/micro-arcade-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/v1/health >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/micro-arcade-worker.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/health >/dev/null
          bun worker/smoke-test.mjs
      - run: bun run worker:check
      - run: bun run build
      - run: MA3_EXPECT_BASE=/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/ bun run quality:ma4
      - run: bun run build:pages
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - run: git diff --check
      - name: Commit game 32 integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/games.ts worker/src/index.ts scripts/audit-ma4.mjs scripts/audit-mobile-runtime.ts package.json README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No game 32 roster changes were produced."
            exit 1
          fi
          git commit -m "Register Neon Rail Shift as game 32"
          git push origin HEAD:fix/desktop-gameplay-32
