name: P29 Operational Readiness

on:
  workflow_run:
    workflows: ["P28 Reliability Control", "Deploy Production", "P30 Guarded Rollback"]
    types: [completed]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: p29-operational-readiness
  cancel-in-progress: false

env:
  P27_SITE_URL: https://thiepn.dev/arcade/
  P27_API_URL: https://hycegznamzjhwinegaai.supabase.co/functions/v1/micro-arcade-leaderboards
  P27_PRODUCTION_ORIGIN: https://thiepn.dev
  P27_POLICY_HASH: b467b52542b31e2a942c7af0dfe11eb4598cbf56c50096278a8be1b1a1a79057
  P29_WINDOW_DAYS: '30'
  P29_SLO_TARGET: '99'
  P29_MIN_CHECKPOINTS: '12'
  P29_RECOVERY_STREAK: '2'
  P29_MAX_EVIDENCE_AGE_HOURS: '12'

jobs:
  diagnose-and-verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Independent three-sample production verification
        continue-on-error: true
        run: bun run quality:production-p27
        env:
          P27_SAMPLES: '3'
          P27_SAMPLE_DELAY_MS: '750'
          P27_ATTEMPTS: '2'
          P27_TIMEOUT_MS: '8000'
          P27_REPORT_DIR: p29-input
      - name: Automated diagnostics and recovery verification
        if: always()
        run: bun run quality:production-p29
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P29_P27_REPORT: p29-input/production-telemetry.json
          P29_REPORT_DIR: p29-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p29-operational-readiness-${{ github.run_number }}
          path: |
            p29-input
            p29-report
          retention-days: 90
          if-no-files-found: warn
