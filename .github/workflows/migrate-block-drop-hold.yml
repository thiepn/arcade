name: Apply Cyber Block Drop Hold

on:
  push:
    branches:
      - fix/desktop-gameplay-32
    paths:
      - scripts/migrate-block-drop-hold.mjs
      - scripts/run-block-drop-migration.mjs
      - scripts/audit-block-drop-hold.ts
      - src/lib/blockDropSupport.ts
      - .github/workflows/migrate-block-drop-hold.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-gameplay-32
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: node scripts/run-block-drop-migration.mjs
      - run: bun run quality:games
      - run: bun run quality:desktop
      - run: bun run quality:blade
      - run: bun run quality:pinball
      - run: bun run quality:chrono
      - run: bun run quality:shortcuts
      - run: bun run quality:pac
      - run: bun run quality:mobile
      - run: bun run quality:rope
      - run: bun run quality:rope-feedback
      - run: bun run quality:rope-phase-c
      - run: bun scripts/audit-block-drop-hold.ts
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: MA3_EXPECT_BASE=/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/ bun run quality:ma4
      - run: bun run build:pages
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - run: git diff --check
      - name: Commit Cyber Block Drop repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/BlockDropGame.tsx src/data/games.ts
          if git diff --cached --quiet; then
            echo "No Cyber Block Drop changes were produced."
            exit 1
          fi
          git commit -m "Upgrade Cyber Block Drop desktop layout and hold"
          git push origin HEAD:fix/desktop-gameplay-32
