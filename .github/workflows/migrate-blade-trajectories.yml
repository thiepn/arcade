name: Apply Laser Blade trajectory migration

on:
  push:
    branches:
      - fix/desktop-gameplay-32
    paths:
      - scripts/migrate-blade-trajectories.mjs
      - .github/workflows/migrate-blade-trajectories.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-gameplay-32
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: node scripts/migrate-blade-trajectories.mjs
      - run: bun run quality:games
      - run: bun run quality:desktop
      - run: bun run quality:blade
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: MA3_EXPECT_BASE=/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/ bun run quality:ma4
      - run: bun run build:pages
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - run: git diff --check
      - name: Commit Laser Blade trajectory repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            CHANGELOG.md \
            package.json \
            scripts/audit-blade-trajectories.ts \
            scripts/audit-desktop-coordinates.mjs \
            src/games/BladeGame.tsx \
            src/lib/bladeTrajectory.ts
          if git diff --cached --quiet; then
            echo "No Laser Blade trajectory changes were produced."
            exit 1
          fi
          git commit -m "Make Laser Blade trajectories height-aware"
          git push origin HEAD:fix/desktop-gameplay-32
