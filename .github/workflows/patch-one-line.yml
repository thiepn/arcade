name: Patch One Line

on:
  push:
    branches: [fix/one-line-fairness]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/one-line-fairness
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify One Line repair
        shell: bash
        run: |
          python scripts/patch-one-line.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/audit-one-line.ts')
          s = p.read_text()
          bad = "assert(!source.includes('onResize: (w, h) => {\n      generateLevel('), 'resize still regenerates the puzzle');"
          good = r"assert(!/onResize:\s*\(w, h\)\s*=>\s*\{\s*generateLevel\(/.test(source), 'resize still regenerates the puzzle');"
          if bad not in s:
              raise SystemExit('generated resize audit anchor not found')
          p.write_text(s.replace(bad, good, 1))
          PY
          rm scripts/patch-one-line.py
          rm .github/workflows/patch-one-line.yml
          bun install --frozen-lockfile
          bun run quality:oneline
          bun run quality:release32
          bunx tsc --noEmit
      - name: Commit repaired One Line
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix One Line physics resize and ink fairness'
          git push origin HEAD:fix/one-line-fairness
