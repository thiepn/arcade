name: P34 Continuous Security Assurance

on:
  push:
    branches: [main]
    paths:
      - 'ops/p34-security-controls.json'
      - 'scripts/p34-*'
      - 'docs/P34_SECURITY_CONTROL_ASSURANCE.md'
      - '.github/workflows/p34-continuous-assurance.yml'
      - '.github/workflows/p27-production-burnin.yml'
      - '.github/workflows/p28-reliability-control.yml'
      - '.github/workflows/p29-operational-readiness.yml'
      - '.github/workflows/p30-continuity-drill.yml'
      - '.github/workflows/p31-offsite-backup.yml'
      - '.github/workflows/p32-cold-recovery.yml'
      - '.github/workflows/p33-long-term-assurance.yml'
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: p34-continuous-security-assurance
  cancel-in-progress: false

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Verify P34 static control contract
        run: bun scripts/audit-operations-p34.mjs
      - name: Evaluate live security controls and build audit-ready evidence pack
        run: bun scripts/p34-control-assurance.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P34_REPORT_DIR: p34-report
          P34_LIVE: '1'
          P34_MUTATE_ISSUES: '1'
          P34_FAIL_ON_DEFICIENCY: '0'
      - name: Upload P34 assurance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p34-security-assurance-${{ github.run_id }}
          path: p34-report
          retention-days: 90
          if-no-files-found: warn
