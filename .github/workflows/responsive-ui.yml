name: Responsive UI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: responsive-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Inspect responsive game layouts
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 >/tmp/ui-preview.log 2>&1 &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173 >/dev/null && break || sleep 1; done
          bun scripts/audit-ui-geometry.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: responsive-ui-evidence
          path: ui-report
          retention-days: 7
