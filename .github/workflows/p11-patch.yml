name: P11 Classic Loop Mastery Patch

on:
  push:
    branches: [gameplay/p11-classic-loop-mastery]

permissions:
  contents: write

jobs:
  patch-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gameplay/p11-classic-loop-mastery
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Apply P11 gameplay patch
        run: |
          python scripts/patch-p11.py
          python - <<'PY'
          from pathlib import Path

          registry = Path('src/data/games.ts')
          text = registry.read_text()
          replacements = [
              (
                  "Grow through wraparound portals and escalating firewalls; Ghost Phase now enables Phase Thread routes",
                  "Grow through wraparound portals as firewall phrases appear every four growth steps; Ghost Phase now enables Phase Thread routes",
                  'P11/P4 Cyber Serpent teaching marker missing',
              ),
              (
                  "Read crystal routes, graze passing comets, and survive telegraphed threat formations",
                  "Read authored crystal routes, graze passing comets, and survive telegraphed threat formations",
                  'P11/P5 Orbit route teaching marker missing',
              ),
          ]
          for old, new, message in replacements:
              if old not in text:
                  raise SystemExit(message)
              text = text.replace(old, new, 1)
          registry.write_text(text)

          orbit = Path('src/games/OrbitGame.tsx')
          orbit_text = orbit.read_text()
          old_hud = "`${threatLabel} • FORMATION x${Math.max(1, state.formationChain)} • ROUTE x${getOrbitRouteMultiplier(state.routeChain)} • GRAZE x${Math.max(1, state.nearMissChain)}`"
          new_hud = "`${threatLabel} • ${getOrbitRouteName(state.routeIndex)} • FORMATION x${Math.max(1, state.formationChain)} • ROUTE x${getOrbitRouteMultiplier(state.routeChain)} • GRAZE x${Math.max(1, state.nearMissChain)}`"
          if old_hud not in orbit_text:
              raise SystemExit('P11/P5 Orbit HUD route marker missing')
          orbit.write_text(orbit_text.replace(old_hud, new_hud, 1))
          PY
      - run: bun install --frozen-lockfile
      - run: bun scripts/audit-gameplay-p11.ts
      - run: bun run quality:games
      - run: bun run quality:pac
      - run: bun run quality:frame-rate
      - run: bun run quality:hud-render
      - run: bun run quality:gameplay-p0
      - run: bun run quality:gameplay-p1
      - run: bun run quality:gameplay-p2
      - run: bun run quality:gameplay-p4
      - run: bun run quality:gameplay-p5
      - run: bun run quality:gameplay-p6
      - run: bun run quality:gameplay-p7
      - run: bun run quality:gameplay-p8
      - run: bun run quality:gameplay-p9
      - run: bun run quality:gameplay-p10
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified P11 source changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/OrbitGame.tsx src/games/PacMazeGame.tsx src/games/SnakeGame.tsx src/data/games.ts
          if git diff --cached --quiet; then
            echo 'No P11 source changes to commit'
            exit 1
          fi
          git commit -m 'Elevate Orbit Pac Runner and Cyber Serpent mastery'
          git push origin HEAD:gameplay/p11-classic-loop-mastery
