name: P30 Guarded Rollback
run-name: P30 Rollback → ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character SHA of a previously successful production deployment
        required: true
        type: string
      confirm_sha:
        description: Re-enter the exact same SHA to authorize the production rollback
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: production
  cancel-in-progress: false

env:
  LEADERBOARD_API_URL: https://hycegznamzjhwinegaai.supabase.co/functions/v1/micro-arcade-leaderboards
  PRODUCTION_ORIGIN: https://thiepn.dev

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target_sha: ${{ steps.authorize.outputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Authorize exact known-good rollback target
        id: authorize
        run: bun scripts/authorize-rollback-p30.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P30_TARGET_SHA: ${{ inputs.target_sha }}
          P30_CONFIRM_SHA: ${{ inputs.confirm_sha }}
          P30_REPORT_DIR: p30-authorization
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: p30-rollback-authorization-${{ github.run_number }}
          path: p30-authorization
          retention-days: 90
          if-no-files-found: warn

  build-certified-target:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.authorize.outputs.target_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: bun install --frozen-lockfile
      - name: Re-certify historical production source
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/audit-production-p26.mjs
          test -f scripts/audit-production-p27.mjs
          bun run quality:scoring
          bun run quality:leaderboard
          VITE_LEADERBOARD_API_URL="${LEADERBOARD_API_URL}" bun run build:pages
          P26_EXPECT_BASE=/arcade/ bun run quality:production-p26
          MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
          MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build-certified-target
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy certified rollback artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  certify-live:
    needs: [authorize, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Certify rolled-back production independently
        shell: bash
        env:
          P3_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          P3_QUICK: '1'
          P26_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          P26_QUICK: '1'
          P27_SITE_URL: ${{ needs.deploy.outputs.page_url }}
          P27_API_URL: ${{ env.LEADERBOARD_API_URL }}
          P27_PRODUCTION_ORIGIN: ${{ env.PRODUCTION_ORIGIN }}
          P27_SAMPLES: '3'
          P27_SAMPLE_DELAY_MS: '750'
          P27_ATTEMPTS: '2'
          P27_TIMEOUT_MS: '8000'
          P27_REPORT_DIR: p30-rollback-live
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo 'Chrome executable not found on runner'
            exit 1
          fi
          P3_CHROME_PATH="$chrome" bun run quality:browser-p3
          P26_CHROME_PATH="$chrome" bun run quality:browser-p26
          bun run quality:production-p27
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: p30-rollback-live-${{ github.run_number }}
          path: p30-rollback-live
          retention-days: 90
          if-no-files-found: warn
