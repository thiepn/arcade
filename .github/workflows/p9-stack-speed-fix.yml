name: P9 Stack Speed Fix

on:
  push:
    branches: [gameplay/p9-next-bottom-three]

permissions:
  contents: write

jobs:
  fix-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gameplay/p9-next-bottom-three
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Decouple Stack speed from mastery bonus score
        run: python scripts/patch-p9-stack-speed.py
      - run: bun install --frozen-lockfile
      - run: bun run quality:gameplay-p9
      - run: bun run quality:frame-rate
      - run: bun run quality:hud-render
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified Stack speed fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/StackGame.tsx
          if git diff --cached --quiet; then
            echo 'No Stack speed change to commit'
            exit 1
          fi
          git commit -m 'Decouple Stack speed from Focus bonus score'
          git push origin HEAD:gameplay/p9-next-bottom-three
