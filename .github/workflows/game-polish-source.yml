name: Game polish source snapshot
on:
  push:
    branches: [feat/deep-game-polish]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: tar -czf /tmp/arcade-polish-source.tar.gz --exclude=.git .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcade-polish-source
          path: /tmp/arcade-polish-source.tar.gz
          retention-days: 2
