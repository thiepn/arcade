name: P32 Cold Recovery Exercise

on:
  push:
    branches: [main]
    paths:
      - 'scripts/p32-*'
      - 'docs/P32_FULL_STACK_DISASTER_RECOVERY.md'
      - 'supabase/functions/micro-arcade-p31-backup-export/**'
      - '.github/workflows/p32-cold-recovery.yml'
  schedule:
    - cron: '19 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write
  issues: write

concurrency:
  group: p32-cold-recovery
  cancel-in-progress: false

env:
  P27_SITE_URL: https://thiepn.dev/arcade/
  P27_API_URL: https://hycegznamzjhwinegaai.supabase.co/functions/v1/micro-arcade-leaderboards
  P27_PRODUCTION_ORIGIN: https://thiepn.dev
  P27_POLICY_HASH: b467b52542b31e2a942c7af0dfe11eb4598cbf56c50096278a8be1b1a1a79057
  P32_DATABASE_URL: postgres://postgres:p32-local-only@127.0.0.1:55434/arcade_p32
  P32_API_URL: http://127.0.0.1:8787/micro-arcade-leaderboards
  P32_FRONTEND_URL: http://127.0.0.1:3000

jobs:
  cold-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: p32-local-only
          POSTGRES_DB: arcade_p32
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arcade_p32"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Install Chromium for isolated browser certification
        run: bunx playwright install --with-deps chromium

      - name: Production pre-exercise verification
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/p32-timing.mjs start production-precheck
          P27_SAMPLES=1 P27_ATTEMPTS=2 P27_TIMEOUT_MS=8000 P27_REPORT_DIR=p32-production-before bun run quality:production-p27
          bun scripts/p32-timing.mjs end production-precheck

      - name: Verify latest retained encrypted P31 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bun scripts/p32-timing.mjs start offsite-reference
          run_id="$(gh run list --workflow p31-offsite-backup.yml --status success --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          test "$run_id" -gt 0
          mkdir -p p32-latest-offsite
          gh run download "$run_id" -n "arcade-p31-offsite-$run_id" -D p32-latest-offsite
          P32_OFFSITE_DIR=p32-latest-offsite bun scripts/p32-offsite-reference.mjs
          bun scripts/p32-timing.mjs end offsite-reference

      - name: Fetch fresh verified recovery payload with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/p32-timing.mjs start source-export
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=arcade-p32-recovery"
          response="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${oidc_url}")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          curl --fail-with-body --silent --show-error             -X POST             -H "Authorization: Bearer $token"             -H "Content-Type: application/json"             -o p32-source.json             "https://hycegznamzjhwinegaai.supabase.co/functions/v1/micro-arcade-p31-backup-export"
          python scripts/p31-verify-offsite.py p32-source.json >/dev/null
          bun scripts/p32-timing.mjs end source-export

      - name: Cold restore protected Arcade data
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/p32-timing.mjs start cold-restore
          P32_SOURCE=p32-source.json P32_REPORT_DIR=p32-report bun scripts/p32-cold-restore.mjs
          bun scripts/p32-timing.mjs end cold-restore

      - name: Start exact-handler cold leaderboard API
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/p32-timing.mjs start cold-api
          nohup bun scripts/p32-cold-api.mjs >p32-cold-api.log 2>&1 &
          echo "$!" > p32-cold-api.pid
          for i in {1..30}; do
            if curl -fsS -H 'Origin: http://127.0.0.1:3000' "$P32_API_URL/v3/health" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS -H 'Origin: http://127.0.0.1:3000' "$P32_API_URL/v3/health" >/dev/null
          bun scripts/p32-timing.mjs end cold-api

      - name: Build and start real frontend against cold API
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/p32-timing.mjs start frontend-build
          VITE_LEADERBOARD_API_URL="$P32_API_URL" bun run build
          nohup bunx vite preview --host 127.0.0.1 --port 3000 >p32-frontend.log 2>&1 &
          echo "$!" > p32-frontend.pid
          for i in {1..30}; do
            if curl -fsS "$P32_FRONTEND_URL" >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$P32_FRONTEND_URL" >/dev/null
          bun scripts/p32-timing.mjs end frontend-build

      - name: Browser certify recovered full stack
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/p32-timing.mjs start browser-certification
          P32_REPORT_DIR=p32-report bun scripts/p32-browser-certify.mjs
          bun scripts/p32-timing.mjs end browser-certification

      - name: Production post-exercise verification
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/p32-timing.mjs start production-postcheck
          P27_SAMPLES=1 P27_ATTEMPTS=2 P27_TIMEOUT_MS=8000 P27_REPORT_DIR=p32-production-after bun run quality:production-p27
          bun scripts/p32-timing.mjs end production-postcheck

      - name: Finalize measured recovery certification
        run: bun run quality:production-p32
        env:
          P32_SOURCE: p32-source.json
          P32_RESTORE: p32-report/restore.json
          P32_BROWSER: p32-report/browser.json
          P32_PRODUCTION_BEFORE: p32-production-before/production-telemetry.json
          P32_PRODUCTION_AFTER: p32-production-after/production-telemetry.json
          P32_TIMINGS: p32-report/timings.json
          P32_OFFSITE: p32-report/offsite-reference.json
          P32_REPORT_DIR: p32-report

      - name: Recovery readiness issue lifecycle
        if: always()
        run: bun scripts/p32-readiness.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          P32_CERTIFICATION: p32-report/certification.json

      - name: Remove plaintext production recovery payload
        if: always()
        shell: bash
        run: |
          shred -u p32-source.json 2>/dev/null || rm -f p32-source.json
          test ! -e p32-source.json

      - name: Upload non-sensitive P32 evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arcade-p32-recovery-${{ github.run_id }}
          path: |
            p32-report
            p32-production-before/summary.md
            p32-production-after/summary.md
          if-no-files-found: warn
          retention-days: 90
