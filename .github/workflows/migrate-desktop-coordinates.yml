name: Apply desktop coordinate migration

on:
  push:
    branches:
      - fix/desktop-gameplay-32
    paths:
      - scripts/migrate-desktop-coordinates.mjs
      - .github/workflows/migrate-desktop-coordinates.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-gameplay-32
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: node scripts/migrate-desktop-coordinates.mjs
      - run: bun run quality:games
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: MA3_EXPECT_BASE=/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/ bun run quality:ma4
      - run: bun run build:pages
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - run: git diff --check
      - name: Commit migrated game coordinates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/BreakoutGame.tsx src/games/ChainGame.tsx src/games/TowerGame.tsx
          if git diff --cached --quiet; then
            echo "No game migration changes were produced."
            exit 1
          fi
          git commit -m "Migrate desktop game worlds to responsive coordinates"
          git push origin HEAD:fix/desktop-gameplay-32
