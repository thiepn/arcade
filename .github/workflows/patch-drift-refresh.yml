name: Patch Cyber Drift Refresh Rate

on:
  push:
    branches: [fix/drift-refresh-rate]
    paths: [.github/workflows/patch-drift-refresh.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/drift-refresh-rate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply and verify Cyber Drift repair
        shell: bash
        run: |
          python scripts/patch-drift-refresh.py
          rm scripts/patch-drift-refresh.py
          bun install --frozen-lockfile
          bun scripts/audit-drift.ts
          bunx tsc --noEmit
          bun run build
      - name: Commit repaired Cyber Drift source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/DriftGame.tsx src/lib/driftRuntime.ts scripts/audit-drift.ts scripts/patch-drift-refresh.py
          git commit -m 'Fix Cyber Drift refresh-rate dependent gameplay'
          git push origin HEAD:fix/drift-refresh-rate
