name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  apply-pac-control-migration:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/desktop-gameplay-32'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Apply migration when needed
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "const alignThreshold = 0.22" src/games/PacMazeGame.tsx; then
            node scripts/migrate-pac-controls.mjs
          else
            echo "Cyber Pac-Runner migration is already applied."
          fi
      - run: bun scripts/audit-pac-controls.ts
      - run: bunx tsc --noEmit
      - name: Commit generated game repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/games/PacMazeGame.tsx
          if git diff --cached --quiet; then
            echo "No generated Cyber Pac-Runner changes to commit."
            exit 0
          fi
          git commit -m "Repair Cyber Pac-Runner desktop controls"
          git push origin HEAD:${{ github.head_ref }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run quality:games
      - run: bun run quality:desktop
      - run: bun run quality:blade
      - run: bun run quality:pinball
      - run: bun run quality:chrono
      - run: bun run quality:shortcuts
      - run: bunx tsc --noEmit
      - run: bun run d1:migrate:local
      - name: Smoke-test Worker API
        shell: bash
        run: |
          set -euo pipefail
          printf 'CREDENTIAL_PEPPER=ci-smoke-test-pepper-not-for-production\n' > .dev.vars
          bunx wrangler dev --local --port 8787 > /tmp/micro-arcade-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/v1/health >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/micro-arcade-worker.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/health >/dev/null
          bun worker/smoke-test.mjs
      - run: bun run worker:check
      - run: bun run build
      - run: MA3_EXPECT_BASE=/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/ bun run quality:ma4
      - run: bun run build:pages
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
