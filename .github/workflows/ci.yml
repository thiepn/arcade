name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run quality:games
      - run: bun run quality:desktop
      - run: bun run quality:blade
      - run: bun run quality:pinball
      - run: bun run quality:chrono
      - run: bun run quality:shortcuts
      - run: bun run quality:pac
      - run: bun run quality:roadcross
      - run: bun run quality:typerush
      - run: bun run quality:oneline
      - run: bun run quality:gravity
      - run: bun run quality:slingshot
      - run: bun run quality:tower
      - run: bun run quality:astro
      - run: bun run quality:drift
      - run: bun run quality:vanguard
      - run: bun run quality:frame-rate
      - run: bun run quality:hud-render
      - run: bun run quality:gameplay-p0
      - run: bun run quality:gameplay-p1
      - run: bun run quality:gameplay-p2
      - run: bun run quality:gameplay-p4
      - run: bun run quality:gameplay-p5
      - run: bun run quality:gameplay-p6
      - run: bun run quality:gameplay-p7
      - run: bun run quality:gameplay-p8
      - run: bun run quality:gameplay-p9
      - run: bun run quality:gameplay-p10
      - run: bun run quality:gameplay-p11
      - run: bun run quality:gameplay-p12
      - run: bun run quality:gameplay-p13
      - run: bun run quality:gameplay-p14
      - run: bun run quality:gameplay-p15
      - run: bun run quality:gameplay-p16
      - run: bun run quality:gameplay-p17
      - run: bun run quality:gameplay-p18
      - run: bun run quality:gameplay-p19
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bun run quality:rope
      - run: bun run quality:rope-feedback
      - run: bun run quality:rope-phase-c
      - run: bun run quality:blockdrop
      - run: bun run quality:knife
      - run: bun run quality:puck
      - run: bun run quality:rail
      - run: bun run quality:release32
      - run: bun run quality:hardening
      - run: bunx tsc --noEmit
      - run: bun run d1:migrate:local
      - name: Smoke-test Worker API
        shell: bash
        run: |
          set -euo pipefail
          printf 'CREDENTIAL_PEPPER=ci-smoke-test-pepper-not-for-production\n' > .dev.vars
          bunx wrangler dev --local --port 8787 > /tmp/micro-arcade-worker.log 2>&1 &
          worker_pid=$!
          cleanup() {
            kill "$worker_pid" 2>/dev/null || true
            wait "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/v1/health >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/micro-arcade-worker.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/health >/dev/null
          bun worker/smoke-test.mjs
      - run: bun run worker:check
      - run: bun run build
      - name: Browser gameplay certification — P3 / P17 / P18 / P19
        shell: bash
        run: |
          set -euo pipefail
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/p3-preview.log 2>&1 &
          preview_pid=$!
          cleanup() {
            kill "$preview_pid" 2>/dev/null || true
            wait "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/p3-preview.log
              exit 1
            fi
            sleep 1
          done
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$chrome" ]; then
            echo 'Chrome executable not found on runner'
            exit 1
          fi
          P3_CHROME_PATH="$chrome" bun run quality:browser-p3
          P17_CHROME_PATH="$chrome" bun run quality:browser-p17
          P18_CHROME_PATH="$chrome" bun run quality:browser-p18
          P19_CHROME_PATH="$chrome" bun run quality:browser-p19
      - run: MA3_EXPECT_BASE=/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/ bun run quality:ma4
      - run: bun run build:pages
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
