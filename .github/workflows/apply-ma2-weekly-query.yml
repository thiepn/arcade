name: Apply MA2 weekly query fix

on:
  push:
    branches: [ma2-weekly-overall-profile]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Apply MA2 weekly query fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ma2-weekly-overall-profile
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Apply exact weekly query fix
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/fix-ma2-weekly-query.mjs
          rm -f scripts/fix-ma2-weekly-query.mjs .github/workflows/apply-ma2-weekly-query.yml
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun run worker:check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Correct weekly best-score tie breaking'
          git push origin HEAD:ma2-weekly-overall-profile
