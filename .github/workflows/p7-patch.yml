name: P7 Mastery Trio Patch

on:
  push:
    branches: [gameplay/p7-mastery-trio]

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: gameplay/p7-mastery-trio
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - name: Apply P7 mastery patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch-p7.py
      - run: bun install --frozen-lockfile
      - run: bun scripts/audit-gameplay-p7.ts
      - run: bun run quality:games
      - run: bun run quality:knife
      - run: bun run quality:rail
      - run: bun run quality:gameplay-p1
      - run: bun run quality:gameplay-p2
      - run: bun run quality:gameplay-p4
      - run: bun run quality:gameplay-p5
      - run: bun run quality:gameplay-p6
      - run: bun run quality:frame-rate
      - run: bun run quality:hud-render
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified P7 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/games/MatrixGame.tsx src/games/KnifeTargetGame.tsx src/games/NeonRailShiftGame.tsx src/data/games.ts
          if git diff --cached --quiet; then
            echo 'No P7 source changes to commit'
            exit 1
          fi
          git commit -m 'Elevate Matrix Knife and Neon Rail mastery'
          git push origin HEAD:gameplay/p7-mastery-trio
