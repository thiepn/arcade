name: P27 Production Burn-In

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p27-production-burn-in
  cancel-in-progress: false

env:
  P27_SITE_URL: https://thiepn.dev/arcade/
  P27_API_URL: https://hycegznamzjhwinegaai.supabase.co/functions/v1/micro-arcade-leaderboards
  P27_PRODUCTION_ORIGIN: https://thiepn.dev
  P27_POLICY_HASH: b467b52542b31e2a942c7af0dfe11eb4598cbf56c50096278a8be1b1a1a79057

jobs:
  burn-in:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Synthetic production availability, contract and latency probes
        run: bun run quality:production-p27
        env:
          P27_SAMPLES: '3'
          P27_SAMPLE_DELAY_MS: '1000'
          P27_ATTEMPTS: '2'
          P27_TIMEOUT_MS: '8000'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p27-production-telemetry-${{ github.run_number }}
          path: p27-report
          retention-days: 30
          if-no-files-found: warn
