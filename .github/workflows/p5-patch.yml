name: P5 Bottom Three Patch

on:
  push:
    branches: [gameplay/p5-bottom-three]

permissions:
  contents: write

jobs:
  patch-and-certify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gameplay/p5-bottom-three
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Apply P5 bottom-three patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/patch-p5.py')
          source = path.read_text()
          source = source.replace(
              "'    \"quality:gameplay-p4\": \"bun scripts/audit-gameplay-p4.ts\",',",
              "'    \"quality:gameplay-p4\": \"bun scripts/audit-gameplay-p4.ts\"',",
          )
          source = source.replace(
              "                setWords([...state.words]);\\n                focusDeviceKeyboard();",
              "                focusDeviceKeyboard();",
          )
          path.write_text(source)
          PY
          python scripts/patch-p5.py
      - run: bun install --frozen-lockfile
      - run: bun run quality:gameplay-p5
      - run: bun run quality:games
      - run: bun run quality:typerush
      - run: bun run quality:frame-rate
      - run: bun run quality:hud-render
      - run: bun run quality:gameplay-p0
      - run: bun run quality:gameplay-p1
      - run: bun run quality:gameplay-p2
      - run: bun run quality:gameplay-p4
      - run: bun run quality:lifecycle
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Commit verified P5 changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/games/OrbitGame.tsx \
            src/games/MergeGame.tsx \
            src/games/TypeRushGame.tsx \
            src/data/games.ts \
            package.json \
            scripts/audit-release-32.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Elevate Orbit Merge and Type Rush gameplay'
          git push origin HEAD:gameplay/p5-bottom-three
