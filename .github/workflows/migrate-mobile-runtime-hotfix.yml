name: Apply cross-game mobile runtime hotfix

on:
  push:
    branches:
      - fix/desktop-gameplay-32
    paths:
      - scripts/migrate-mobile-runtime-hotfix.mjs
      - .github/workflows/migrate-mobile-runtime-hotfix.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-gameplay-32
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: node scripts/migrate-mobile-runtime-hotfix.mjs
      - run: bun run quality:games
      - run: bun run quality:desktop
      - run: bun run quality:blade
      - run: bun run quality:pinball
      - run: bun run quality:chrono
      - run: bun run quality:shortcuts
      - run: bun run quality:pac
      - run: bun run quality:mobile
      - run: bunx tsc --noEmit
      - run: bun run build
      - run: MA3_EXPECT_BASE=/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/ bun run quality:ma4
      - run: bun run build:pages
      - run: MA3_EXPECT_BASE=/arcade/ bun run quality:ma3
      - run: MA4_EXPECT_BASE=/arcade/ bun run quality:ma4
      - run: git diff --check
      - name: Commit mobile runtime hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GameShell.tsx src/games/DriftGame.tsx src/index.css
          if git diff --cached --quiet; then
            echo "No mobile runtime changes were produced."
            exit 1
          fi
          git commit -m "Hotfix mobile canvas runtime and Cyber Drift"
          git push origin HEAD:fix/desktop-gameplay-32
