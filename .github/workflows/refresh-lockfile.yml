name: Refresh dependency lockfile

on:
  push:
    branches: [dependency-lockfile-cleanup]
    paths:
      - '.dependency-refresh/**'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only
      - name: Verify frozen install
        run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "thiepn"
          git config user.email "junsosmart@gmail.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "Regenerate Bun lockfile after dependency cleanup"
          git push origin HEAD:dependency-lockfile-cleanup
