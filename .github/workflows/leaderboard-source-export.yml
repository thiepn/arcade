name: Leaderboard Source Export
on:
  push:
    branches: [audit/leaderboard-rebuild-source]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: git archive HEAD | gzip > source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: leaderboard-source
          path: source.tar.gz
          retention-days: 1
